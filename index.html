<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hifz Revival</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hifz">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: one-column phone app, sticky top bar, fixed bottom tab bar; mushaf page sits on a "paper" surface. */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --paper:#FFFDF8; --ink:#13232E; --muted:#5A6B70; --line:#D6E0DE;
  --accent:#0E6B5E;--tjg:#9A9A9A;--tj3:#537FFF;--tj4:#4050FF;--tj5:#000EBC;--tj6:#2144C1;--tj7:#DD0008;--tj8:#D500B7;--tj9:#9400A8;--tj10:#58B800;--tj11:#26BFFD;--tj12:#169777;--tj13:#169200;--tj16:#FF7E1E; --accent-ink:#FFFFFF; --accent-soft:#DCEEE9; --gold:#A86A12; --gold-soft:#F6E9D2;
  --danger:#B42318; --danger-soft:#FBE4E1; --ok:#1C7A3B; --ok-soft:#DDF2E3; --warn:#9A5B00; --warn-soft:#FBEBCF;
  --l-dh:#1D5FD1; --l-z:#0F8A8A; --l-zh:#7A3FC2; --l-d:#C0262D; --l-th:#D06A00; --l-s:#2C8A2C; --l-sd:#8A5A2B;
  --s0:#E4E9E8; --s1:#F2C6BE; --s2:#F3DDA9; --s3:#BFE0C5; --s4:#7FC195; --s5:#2F8F55;
  --f-quran:"Amiri Quran","Noto Naskh Arabic","Geeza Pro",serif;
  --f-ar:"Noto Naskh Arabic","Geeza Pro",serif;
  --f-ui:"Atkinson Hyperlegible",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-ml:"Noto Sans Malayalam","Malayalam Sangam MN",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1517; --surface:#162125; --paper:#1A2428; --ink:#E6EEEC; --muted:#97A8AA; --line:#2A3A3E;
  --accent:#4DBFAC;--tjg:#8A9192;--tj3:#8FA8FF;--tj4:#8C95FF;--tj5:#7C86FF;--tj6:#7E9BFF;--tj7:#FF6B6E;--tj8:#F27BE0;--tj9:#CF86E6;--tj10:#8AD94A;--tj11:#5FD3FF;--tj12:#3CC9A0;--tj13:#5CC94A;--tj16:#FFA057; --accent-ink:#06211C; --accent-soft:#1B3A35; --gold:#E2B25F; --gold-soft:#3A2E17;
  --danger:#F2897C; --danger-soft:#3E1F1C; --ok:#6CCB8C; --ok-soft:#1A3624; --warn:#F0B45A; --warn-soft:#3A2B12;
  --l-dh:#7FA9FF; --l-z:#4FD1CF; --l-zh:#C49BFF; --l-d:#FF8A8F; --l-th:#FFB061; --l-s:#7FD67F; --l-sd:#D9A877;
  --s0:#26343A; --s1:#5A2E2A; --s2:#5C4A20; --s3:#2E5A3A; --s4:#3C8A5B; --s5:#5FD18C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1517; --surface:#162125; --paper:#1A2428; --ink:#E6EEEC; --muted:#97A8AA; --line:#2A3A3E;
  --accent:#4DBFAC;--tjg:#8A9192;--tj3:#8FA8FF;--tj4:#8C95FF;--tj5:#7C86FF;--tj6:#7E9BFF;--tj7:#FF6B6E;--tj8:#F27BE0;--tj9:#CF86E6;--tj10:#8AD94A;--tj11:#5FD3FF;--tj12:#3CC9A0;--tj13:#5CC94A;--tj16:#FFA057; --accent-ink:#06211C; --accent-soft:#1B3A35; --gold:#E2B25F; --gold-soft:#3A2E17;
  --danger:#F2897C; --danger-soft:#3E1F1C; --ok:#6CCB8C; --ok-soft:#1A3624; --warn:#F0B45A; --warn-soft:#3A2B12;
  --l-dh:#7FA9FF; --l-z:#4FD1CF; --l-zh:#C49BFF; --l-d:#FF8A8F; --l-th:#FFB061; --l-s:#7FD67F; --l-sd:#D9A877;
  --s0:#26343A; --s1:#5A2E2A; --s2:#5C4A20; --s3:#2E5A3A; --s4:#3C8A5B; --s5:#5FD18C; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:18px;letter-spacing:.2px}
.brand .ar{font-family:var(--f-ar);font-size:20px;color:var(--accent)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:20px}
h3{font-size:16px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.ml{font-family:var(--f-ml);font-size:15px;line-height:1.7}
.ar{font-family:var(--f-ar);direction:rtl}
button,.btn{font:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,.btn:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.sm{min-height:34px;padding:5px 10px;font-size:14px}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
button:disabled{opacity:.5;cursor:default}
select,input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;max-width:100%}
textarea{width:100%;min-height:110px;font-family:var(--f-ar);font-size:22px;line-height:1.8;direction:rtl}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;flex:1 1 auto;min-height:38px;font-size:14px;background:var(--surface)}
.seg button+button{border-inline-start:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--ink)}
.pill.red{background:var(--danger-soft)}.pill.amber{background:var(--warn-soft)}.pill.green{background:var(--ok-soft)}.pill.gold{background:var(--gold-soft)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700}
nav.tabs a .g{font-family:var(--f-ar);font-size:20px;line-height:1.1}
nav.tabs a[aria-current="page"]{color:var(--accent)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.task{display:flex;gap:12px;align-items:flex-start;padding-block:10px;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task .ic{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--f-ar);font-size:18px;color:var(--accent);font-weight:700}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;min-height:32px;border-radius:999px}
.chip.due{border-color:var(--warn)}
.chip.weak{border-color:var(--danger)}
/* page map */
.map{display:flex;flex-direction:column;gap:3px}
.mrow{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center}
.mrow .j{font-size:11px;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.cell{aspect-ratio:1;border-radius:2px;background:var(--s0);border:0;padding:0;min-height:0;max-width:100%}
.cell.r{background:var(--s1)}.cell.a0,.cell.a1{background:var(--s2)}.cell.a2,.cell.a3{background:var(--s3)}.cell.a4,.cell.a5{background:var(--s4)}.cell.a6,.cell.a7{background:var(--s5)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;vertical-align:-1px}
/* mushaf */
.pagebar{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;min-width:0}
.mus{font-family:var(--f-quran);direction:rtl;text-align:justify;text-align-last:center;font-size:27px;line-height:2.25;word-spacing:2px}
.mus.big{font-size:31px}
.ayah{border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ayah:hover{background:var(--accent-soft)}
.ayah.sel{background:var(--gold-soft)}
.anum{font-family:var(--f-quran);color:var(--accent);font-size:.85em;padding-inline:2px}
.shead{display:flex;flex-direction:column;align-items:center;gap:2px;margin-block:6px 4px;border-block:1px solid var(--line);padding-block:6px}
.shead .n{font-family:var(--f-ar);font-size:20px;font-weight:700;color:var(--accent)}
.basm{font-family:var(--f-quran);font-size:24px;text-align:center;direction:rtl}
.hid{display:inline-block;min-width:64px;height:.9em;vertical-align:middle;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 14px)}
.anchor{color:var(--muted)}
.c-dh{color:var(--l-dh)}.c-z{color:var(--l-z)}.c-zh{color:var(--l-zh)}.c-d{color:var(--l-d)}.c-th{color:var(--l-th)}.c-s{color:var(--l-s)}.c-sd{color:var(--l-sd)}
.wf{color:var(--gold);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:10px}
.gradebar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gradebar button{flex-direction:column;gap:0;font-size:14px;padding:6px 4px}
.gradebar button small{font-size:11px;color:var(--muted);font-weight:400}
.g0{border-color:var(--danger)}.g1{border-color:var(--warn)}.g2{border-color:var(--ok)}.g3{border-color:var(--accent)}
/* diff */
.diff{font-family:var(--f-ar);direction:rtl;font-size:22px;line-height:2.1}
.diff span{padding-inline:3px;border-radius:5px}
.d-ok{color:var(--ink)}
.d-miss{background:var(--danger-soft);color:var(--danger);text-decoration:underline dotted}
.d-sub{background:var(--warn-soft);color:var(--warn)}
.d-wf{background:var(--gold-soft);color:var(--gold);font-weight:700}
.d-extra{color:var(--muted);text-decoration:line-through}
.d-sub small,.d-wf small{font-size:13px;opacity:.85}
/* wa fa quiz */
.qbox{font-family:var(--f-quran);direction:rtl;font-size:28px;line-height:2.2;text-align:center}
.qbox .ctx{color:var(--muted);font-size:22px;display:block;line-height:2}
.gap{display:inline-block;min-width:1.4em;border-bottom:3px solid var(--gold);color:var(--gold);text-align:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers button{font-family:var(--f-ar);font-size:34px;min-height:70px}
.answers button.right{background:var(--ok-soft);border-color:var(--ok)}
.answers button.wrong{background:var(--danger-soft);border-color:var(--danger)}
.hit{background:var(--gold-soft);border-radius:6px}
.why{white-space:pre-wrap}
/* makharij */
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.lcard .big{font-family:var(--f-ar);font-size:52px;line-height:1.1;text-align:center}
.attr{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:14px}
.attr dt{color:var(--muted)}
.attr dd{margin:0}
.pairs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center}
.pairs .w{font-family:var(--f-quran);font-size:26px;direction:rtl;text-align:center}
.pairs .m{font-size:12px;color:var(--muted);text-align:center}
.wordlist{display:flex;flex-wrap:wrap;gap:8px}
.wordlist .wd{font-family:var(--f-quran);font-size:26px;direction:rtl;border:1px solid var(--line);border-radius:10px;padding:2px 12px;background:var(--paper);display:flex;flex-direction:column;align-items:center}
.wordlist .wd small{font-family:var(--f-ui);font-size:11px;color:var(--muted);direction:ltr}
.feedback{border-radius:10px;padding:10px 12px;font-size:15px}
.feedback.okk{background:var(--ok-soft)}.feedback.bad{background:var(--danger-soft)}.feedback.mid{background:var(--warn-soft)}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
details>summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";float:right;color:var(--muted)}
details[open]>summary::after{content:"–"}
details>div{padding-bottom:14px;display:flex;flex-direction:column;gap:8px}
ol,ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.juzlist{display:flex;flex-direction:column;gap:6px}
.juzrow{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center}
.juzrow .seg button{font-size:13px;min-height:34px;padding:4px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90vw}
.sheet{position:fixed;inset:auto 0 0 0;z-index:35;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px;max-height:80vh;overflow:auto}
.sheet .in{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:34}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--s0);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.seqline{font-family:var(--f-quran);direction:rtl;font-size:30px;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px}
.seqline i{color:var(--muted);font-style:normal}
.qrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;text-align:start;width:100%;justify-content:stretch}
.qrow .qn{font-size:20px}.qrow .qr{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.srow{display:flex;flex-direction:column;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}.srow .seg{flex:1 1 220px}.parts{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;background:var(--bg)}
details.jz>div{gap:0}
@font-face{font-family:"IndoPak";src:url("indopak.woff2") format("woff2");font-display:swap}
.mus.lay{text-align:initial;text-align-last:initial;line-height:1.95;font-size:26px;word-spacing:0;display:flex;flex-direction:column}
.mus.lay.ip{font-family:"IndoPak","Noto Naskh Arabic",serif;line-height:2.05}
.mus.lay .ln{display:flex;justify-content:space-between;align-items:baseline;gap:.18em;white-space:nowrap;min-height:1.95em}
.mus.lay .ln.short{justify-content:center;gap:.4em}
.mus.lay .ln.blank{min-height:.6em}
.mus.lay .ln.shead{justify-content:center;border-block:1px solid var(--line);border-radius:6px;font-family:var(--f-ar);font-size:.7em;color:var(--accent);font-weight:700;align-items:center}
.mus.lay .ln.basm{justify-content:center;font-size:.85em}
.mus.lay.measure .ln{justify-content:flex-start;width:max-content}
.mus.lay .w{cursor:pointer;border-radius:4px}
.mus.lay .w.sel{background:var(--gold-soft)}
.mus.lay .hw{color:transparent;background:var(--line);border-radius:6px;opacity:.55}
.mus.lay .anchor{color:var(--muted)}
.mus.lay .anum{color:var(--accent);font-size:.8em}
.hw{color:transparent;background:var(--line);border-radius:6px;opacity:.55}
.bookwrap{perspective:1800px;position:relative}
.book{position:relative;transform-origin:right center;transform-style:preserve-3d;will-change:transform;
  border:1px solid var(--line);box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 6.5px var(--gold),0 6px 18px rgba(0,0,0,.10),-3px 0 0 -1px var(--paper),-4px 0 0 -1px var(--line),-7px 0 0 -2px var(--paper),-8px 0 0 -2px var(--line);
  background:var(--paper);background-image:linear-gradient(to left,rgba(0,0,0,.07),rgba(0,0,0,0) 7%)}
.book::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;background:linear-gradient(to left,rgba(0,0,0,0),rgba(0,0,0,.28))}
.phead,.pfoot{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-ar);color:var(--gold);font-size:13px;padding:2px 10px;direction:rtl}
.pfoot{justify-content:center;font-size:15px}
.pfoot span{border:1px solid var(--gold);border-radius:999px;padding:0 12px;min-width:44px;text-align:center}
.book.out-next{animation:outNext .36s ease-in forwards}.book.out-next::after{animation:shade .36s ease-in forwards}
.book.in-next{animation:inNext .3s ease-out}
.book.out-prev{animation:outPrev .25s ease-in forwards}
.book.in-prev{animation:inPrev .4s ease-out}.book.in-prev::after{animation:unshade .4s ease-out}
@keyframes outNext{to{transform:rotateY(88deg)}}
@keyframes inNext{from{transform:scale(.985);filter:brightness(.92)}to{transform:none;filter:none}}
@keyframes outPrev{to{transform:scale(.985);filter:brightness(.92)}}
@keyframes inPrev{from{transform:rotateY(88deg)}to{transform:none}}
@keyframes shade{to{opacity:1}}@keyframes unshade{from{opacity:1}to{opacity:0}}
body.reader header.top,body.reader nav.tabs,body.reader #app .stack>:not(.bookwrap){display:none!important}
body.reader #app{padding-bottom:16px}

.tj10{color:var(--tj10)}.tj11{color:var(--tj11)}.tj12{color:var(--tj12)}.tj13{color:var(--tj13)}.tj14,.tj15{color:var(--tjg)}.tj16{color:var(--tj16)}
</style>

<body>
<header class="top wrap">
  <div class="brand"><span class="ar">حِفْظ</span><b>Hifz Revival</b></div>
  <span class="sync" id="sync">Saved on this phone</span>
</header>

<main class="wrap" id="app"><div class="loading">Loading the Qur'an text…</div></main>

<nav class="tabs" aria-label="Sections"><div class="in">
  <a href="#today" data-tab="today"><span class="g">◉</span>Today</a>
  <a href="#mushaf" data-tab="mushaf"><span class="g">مُصحف</span>Mushaf</a>
  <a href="#wafa" data-tab="wafa"><span class="g">و/ف</span>Wa / Fa</a>
  <a href="#makharij" data-tab="makharij"><span class="g">ذ ظ ض</span>Letters</a>
  <a href="#guide" data-tab="guide"><span class="g">؟</span>Method</a>
</div></nav>
<div id="overlay"></div>

<script>
(function(){
"use strict";
/* ---------------- utilities ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AD=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const DIAC=/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
const MARKS=/^[ؐ-ًؚ-ٰٟۖ-ۭـ]+/;
const LETTER=/[ء-يٱ]/;
function norm(w){return w.replace(/ڪ/g,'ك').replace(/[یۍ]/g,'ي').replace(/[ہھ]/g,'ه').replace(/ۃ/g,'ة').replace(DIAC,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-ي]/g,'')}
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let toastT;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

/* ---------------- state ---------------- */
const LS='hifz-revival-v1';
const DEF=()=>({v:1,setup:false,updated:0,juz:Object.fromEntries(Array.from({length:30},(_,i)=>[i+1,i>=16?'forgot':'none'])),
  pages:{},layout:'madani',perDay:2,cap:20,order:'asc',cur:1,mode:'read',color:true,markwf:true,big:false,
  wf:{},wfStats:{r:0,w:0},log:{},mistakes:[],mk:{},qirath:null,snd:[],mem:{},wish:[],newPerDay:5,salah:{},tajweed:false,aud:{each:1,all:1,rate:1,gap:false},mtab:'ml'});
let S=DEF();
try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);if(!o.mem){o.mem={};o.setup=false}S=Object.assign(DEF(),o)}}catch(e){}
let dbDoc=null,saveT=null;
function save(){S.updated=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(async()=>{if(!dbDoc)return;try{await dbDoc.set({state:JSON.stringify(S),updated:S.updated});setSync('Saved to your account')}catch(e){setSync('Saved on this phone only')}},1200)}
function setSync(t){const el=$('#sync');if(el)el.textContent=t}
function logDay(k,n=1){const d=today();S.log[d]=S.log[d]||{};S.log[d][k]=(S.log[d][k]||0)+n}

/* ---------------- data ---------------- */
let Q=null,SUR=[],PAGES=[],JUZP=[],TOK=[],CONF=null,FREQ=null,PAIRS=null;
async function loadData(){
  const el=document.getElementById('qdata');if(el&&el.textContent.length>1000){Q=JSON.parse(el.textContent)}else{const r=await fetch('quran.json');Q=await r.json()}SUR=Q.s;
  const ld=document.getElementById('ldata');if(ld&&ld.textContent.length>1000){LAYD=JSON.parse(ld.textContent)}else{const r2=await fetch('layouts.json');LAYD=await r2.json()}
  buildLayout(S.layout||'madani');
  TOK=Q.a.map(a=>a[5].split(' '));
  FREQ=new Set();TOK.forEach(t=>t.forEach(w=>{const n=norm(w);if(n)FREQ.add(n)}));
  await loadExtra();
}
const pageJuz=p=>Q.a[PAGES[p][0]][2];
const isConf=n=>n.length>=3&&(n[0]==='و'||n[0]==='ف')&&FREQ.has((n[0]==='و'?'ف':'و')+n.slice(1));
const ref=i=>`${SUR[Q.a[i][0]-1][1]} ${Q.a[i][0]}:${Q.a[i][1]}`;

/* mutashabihat: same surrounding words, only و/ف differs */
function buildPairs(){
  if(PAIRS)return PAIRS;const m=new Map();
  TOK.forEach((t,ai)=>{const ws=[];t.forEach((w,ti)=>{if(LETTER.test(w))ws.push([ti,norm(w)])});
    ws.forEach(([ti,n],k)=>{if(!isConf(n))return;const ctx=[];for(let x=k;x<=k+3;x++){if(x<0||x>=ws.length)continue;ctx.push(x===k?'*'+n.slice(1):ws[x][1])}
      if(ctx.length<4)return;const key=ctx.join(' ');if(!m.has(key))m.set(key,{w:[],f:[]});m.get(key)[n[0]==='و'?'w':'f'].push([ai,ti])})});
  PAIRS=[];for(const[k,v]of m)if(v.w.length&&v.f.length)PAIRS.push(v);
  return PAIRS}

/* ---------------- spaced repetition (pages) ---------------- */
const IV=[1,1,2,4,7,15,30,60];
function revivePages(){const list=Object.keys(S.pages).map(Number).filter(p=>S.pages[p].st==='revive').sort((a,b)=>a-b);if(S.order==='desc')list.reverse();return list}
function dueToday(){const t=today();return Object.keys(S.pages).map(Number).filter(p=>S.pages[p].st==='active'&&S.pages[p].due<=t)
  .sort((a,b)=>(S.pages[a].s-S.pages[b].s)||(S.pages[a].due-S.pages[b].due)||a-b)}
function grade(p,g){const t=today();let o=S.pages[p];if(!o||o.st!=='active')o={st:'active',s:1,due:t};
  if(g===0)o.s=0;else if(g===1)o.s=Math.max(1,o.s-1);else if(g===2)o.s=Math.min(o.s+1,7);else o.s=Math.min(o.s+2,7);
  o.due=t+(g<=1?1:IV[o.s]);o.last=t;S.pages[p]=o;logDay('rev');save()}
function markRevived(p){S.pages[p]={st:'active',s:1,due:today()+1,last:today()};logDay('revive');save()}
function streak(){let d=today(),n=0;if(!S.log[d])d--;while(S.log[d]){n++;d--}return n}

/* ---------------- routing ---------------- */
const TABS=['today','mushaf','wafa','makharij','guide','qirath','salah','wish'];
function route(){const h=location.hash.replace('#','');const tab=TABS.includes(h)?h:'today';
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===(tab==='qirath'||tab==='salah'||tab==='wish'?'today':tab)?'page':'false'));
  closeSheet();if(tab!=='mushaf'){document.body.classList.remove('reader');const xb=document.querySelector('.exitread');if(xb)xb.remove()}R[tab]();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{if(Q)route()});
function go(tab){if(location.hash==='#'+tab)route();else location.hash=tab}
const R={};

/* ================= TODAY ================= */
R.today=function(){
  const app=$('#app');
  if(!S.setup){app.innerHTML=setupHTML(true);bindSetup();return}
  const rv=revivePages(),due=dueToday(),t=today();
  const todayRevive=rv.slice(0,S.perDay),todayDue=due.slice(0,S.cap);
  const act=Object.values(S.pages).filter(o=>o.st==='active');
  const strong=act.filter(o=>o.s>=4).length;
  const total=Object.keys(S.pages).length;
  const wfDue=Object.values(S.wf).filter(o=>o.due<=t).length;
  const lg=S.log[t]||{};
  const grp=GROUPS[t%GROUPS.length];if(!S.qirath)migrateQirath();const qd=qDue();const wt=wishToday();
  app.innerHTML=`<div class="stack" style="padding-top:14px">
   <div class="stats">
     <div class="stat"><div class="n">${act.length}<span class="tiny muted">/${total}</span></div><div class="l">pages back in revision</div></div>
     <div class="stat"><div class="n">${strong}</div><div class="l">pages strong</div></div>
     <div class="stat"><div class="n">${streak()}</div><div class="l">day streak</div></div>
   </div>
   ${salahCardHTML()}
   <section class="card" aria-labelledby="tp"><div class="row" style="justify-content:space-between"><h2 id="tp">Today's plan</h2><span class="pill">${new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</span></div>
    <div class="task"><div class="ic">١</div><div class="body"><h3>Revision first (Manzil / Sabqi)</h3>
      <div class="small muted">${todayDue.length?`${todayDue.length} page${todayDue.length>1?'s':''} due. Recite each from memory, then check and grade it. Weakest pages first.`:'Nothing due. Well done. Your revived pages come back here on schedule.'}${due.length>S.cap?` <b>${due.length-S.cap} more overdue</b> wait for tomorrow.`:''} ${lg.rev?`<span class="pill green">${lg.rev} graded today</span>`:''}</div>
      <div class="chips">${todayDue.map(p=>`<button class="chip ${S.pages[p].s<=1?'weak':'due'}" data-open="${p}">p ${p}</button>`).join('')}</div></div></div>
    <div class="task"><div class="ic">📿</div><div class="body"><h3>Qirath for prayer</h3>
      <div class="small muted">${qd.length?`Recite ${Math.min(2,qd.length)} of your prayer passages today, in ṣalāh if you can, then grade them.`:'No passage due today.'} ${lg.qirath?`<span class="pill green">${lg.qirath} done today</span>`:''}</div>
      <div class="chips">${qd.slice(0,2).map(([q,n])=>`<button class="chip due" data-qopen="${n}">${esc(qName(q))}</button>`).join('')}<button class="chip" data-go="qirath">All ${S.qirath.length} passages</button></div></div></div>
    <div class="task"><div class="ic">٢</div><div class="body"><h3>Revive forgotten pages (Sabaq)</h3>
      <div class="small muted">${rv.length?`${S.perDay} page${S.perDay>1?'s':''} a day. Read, repeat ayah by ayah, then recite the whole page without looking. ${rv.length} pages left to revive (about ${Math.ceil(rv.length/S.perDay)} days).`:'Everything you marked is revived. Mark more in Settings below.'} ${lg.revive?`<span class="pill green">${lg.revive} revived today</span>`:''}</div>
      <div class="chips">${todayRevive.map(p=>`<button class="chip" data-open="${p}">p ${p} · Juz ${pageJuz(p)}</button>`).join('')}</div></div></div>
    <div class="task"><div class="ic">+</div><div class="body"><h3>New memorisation (wish list)</h3>
      <div class="small muted">${wt?`Today: ${esc(SUR[wt.w.s-1][1])} ${wt.w.s}:${wt.from}–${wt.to}.`:'Add the passages you want to memorise next.'} ${lg.new?`<span class="pill green">${lg.new} new ayat today</span>`:''}</div>
      <div class="row">${wt?'<button class="primary sm" data-wish="1">Start</button>':''}<button class="sm" data-go="wish">My wish list${(S.wish||[]).length?' ('+S.wish.length+')':''}</button></div></div></div>
    <div class="task"><div class="ic">و</div><div class="body"><h3>و / ف drill (10 questions)</h3>
      <div class="small muted">${wfDue?`${wfDue} past mistakes are due again.`:'Short test on the و/ف words from your own memorised parts.'} ${lg.wf?`<span class="pill green">${lg.wf} answered today</span>`:''}</div>
      <div class="row"><button class="primary sm" data-go="wafa">Start drill</button></div></div></div>
    <div class="task"><div class="ic">ظ</div><div class="body"><h3>Letter practice: ${grp.title}</h3>
      <div class="small muted">5 minutes. Use the mirror and throat test, then say the words.</div>
      <div class="row"><button class="sm" data-mk="${grp.id}">Open practice</button></div></div></div>
   </section>
   <section class="card" aria-labelledby="mp"><div class="row" style="justify-content:space-between"><h2 id="mp">Your mushaf map</h2><span class="tiny muted">tap a square to open the page</span></div>
     <div class="legend"><span><i style="background:var(--s0)"></i>not in plan</span><span><i style="background:var(--s1)"></i>to revive</span><span><i style="background:var(--s2)"></i>weak</span><span><i style="background:var(--s3)"></i>okay</span><span><i style="background:var(--s4)"></i>strong</span><span><i style="background:var(--s5)"></i>very strong</span></div>
     <div class="map">${Array.from({length:30},(_,i)=>i+1).map(j=>`<div class="mrow"><span class="j">${j}</span><div class="cells">${JUZP[j].map(p=>{const o=S.pages[p];const c=!o?'':o.st==='revive'?'r':'a'+o.s;return `<button class="cell ${c}" data-open="${p}" aria-label="Page ${p}" title="Page ${p}"></button>`}).join('')}</div></div>`).join('')}</div>
   </section>
   <details><summary>Settings and what I memorised</summary><div>${setupHTML(false)}</div></details>
  </div>`;
  bindCommon(app);bindSetup();
};
function memParts(){const out=[];Object.keys(S.mem||{}).forEach(s=>(S.mem[s]||[]).forEach(p=>out.push({s:+s,a:p.a,e:p.e,st:p.st})));return out}
function partIds(p){const a=aIndex(p.s,p.a),b=aIndex(p.s,p.e);const r=[];for(let i=a;i<=b;i++)r.push(i);return r}
function memPageMap(){const m=new Map();memParts().forEach(p=>partIds(p).forEach(i=>{const pg=AP[i];if(p.st==='good'||!m.has(pg))m.set(pg,p.st)}));
  if(S.qirath)qPages().forEach(pg=>m.set(pg,'good'));return m}
function applySetup(){const t=today();const old=S.pages;S.pages={};let k=0;
  memPageMap().forEach((st,p)=>{if(old[p]&&old[p].st==='active'){S.pages[p]=old[p];return}
    S.pages[p]=st==='good'?{st:'active',s:3,due:t+(k++%7),last:0}:{st:'revive'}});
  S.setup=true;save()}
function memSummary(){const m=memPageMap();let f=0,g=0;m.forEach(v=>v==='good'?g++:f++);return `<b>${m.size}</b> pages marked (about ${(m.size/20).toFixed(1)} juz): <span class="pill red">${f} to revive</span> <span class="pill green">${g} still good</span>`}
function surahJuz(s){return Q.a[aIndex(s,1)][2]}
function rowHTML(s){const n=SUR[s-1][2];const parts=(S.mem[s]||[]);const whole=parts.length===1&&parts[0].a===1&&parts[0].e===n;const st=!parts.length?'none':whole?parts[0].st:'parts';
  const inQ=(S.qirath||[]).filter(q=>q.s===s);
  return `<div class="srow" data-s="${s}"><div class="sname"><span class="ar" style="font-size:19px">${esc(SUR[s-1][0])}</span> <span class="small">${s}. ${esc(SUR[s-1][1])}</span> <span class="tiny muted">${n} ayat</span>${inQ.length?` <span class="pill gold">📿 ${inQ.map(q=>q.a+'–'+q.e).join(', ')}</span>`:''}</div>
   <div class="row"><div class="seg" role="group" aria-label="${esc(SUR[s-1][1])}">${[['none','No'],['forgot','Forgot'],['good','Still good']].map(([v,l])=>`<button type="button" data-ws="${s}" data-v="${v}" aria-pressed="${st===v}">${l}</button>`).join('')}</div><button type="button" class="sm" data-parts="${s}" aria-pressed="${st==='parts'}">Some ayat${st==='parts'?' ('+parts.length+')':''}</button></div>
   <div class="parts" ${st==='parts'||MEMOPEN.has(s)?'':'hidden'}>${parts.map((p,k)=>`<div class="row small"><label for="pa${s}_${k}">Ayah</label><input id="pa${s}_${k}" data-pa="${s}:${k}" type="number" min="1" max="${n}" value="${p.a}" style="width:70px"><label for="pe${s}_${k}">to</label><input id="pe${s}_${k}" data-pe="${s}:${k}" type="number" min="1" max="${n}" value="${p.e}" style="width:70px"><select data-pst="${s}:${k}" aria-label="State"><option value="forgot" ${p.st==='forgot'?'selected':''}>Forgot</option><option value="good" ${p.st==='good'?'selected':''}>Still good</option></select><button type="button" class="sm ghost" data-prm="${s}:${k}">Remove</button></div>`).join('')}
    <button type="button" class="sm" data-padd="${s}">+ Add ayat range</button></div></div>`}
const MEMOPEN=new Set();
function setupHTML(first){const groups=Array.from({length:30},()=>[]);for(let s=1;s<=114;s++)groups[surahJuz(s)-1].push(s);
  return `<div class="${first?'stack':''}" style="${first?'padding-top:14px':''}">
  ${first?`<section class="card"><span class="eyebrow">Set up</span><h2>What have you memorised?</h2>
  <p class="small muted" style="margin:0">Mark it surah by surah. It can be scattered: a whole surah, or just some ayat (tap <b>Some ayat</b>, and add as many ranges as you need). <b>Forgot</b> = we revive it page by page. <b>Still good</b> = straight into revision. Your 30 Qirath passages are already counted as "still good" (marked 📿).</p>`:''}
  <div class="small" id="memSum">${memSummary()}</div>
  <input id="sf" type="search" placeholder="Find a surah (name or number)" aria-label="Find a surah" style="width:100%">
  <div id="memList" class="stack" style="gap:8px">${groups.map((ss,j)=>ss.length?`<details class="jz" data-j="${j+1}" ${ss.some(s=>(S.mem[s]||[]).length||(S.qirath||[]).some(q=>q.s===s))?'open':''}><summary>Juz ${j+1} <span class="tiny muted">· ${ss.map(s=>SUR[s-1][1]).join(', ')}</span></summary><div>${ss.map(rowHTML).join('')}</div></details>`:'').join('')}</div>
  <div class="row"><label class="small" for="laySel">My mushaf</label>${layoutSelectHTML()}</div>
  <div class="row"><label class="small" for="perDay">Pages to revive a day</label><select id="perDay">${[1,2,3,4,5].map(n=>`<option ${S.perDay===n?'selected':''}>${n}</option>`).join('')}</select>
   <label class="small" for="cap">Max revision pages a day</label><select id="cap">${[10,20,30,40].map(n=>`<option value="${n}" ${S.cap===n?'selected':''}>${n}${n===20?' (1 juz)':''}</option>`).join('')}</select>
   <label class="small" for="order">Revive order</label><select id="order"><option value="asc" ${S.order==='asc'?'selected':''}>From the first page</option><option value="desc" ${S.order==='desc'?'selected':''}>From the last page backwards</option></select></div>
  <div class="row"><button class="primary" id="applySetup">${first?'Start my plan':'Save changes'}</button><span class="tiny muted">${first?'You can change this any time in Settings at the bottom of Today.':'Pages already in revision keep their progress.'}</span></div>
  ${first?'</section>':''}</div>`}
function bindSetup(){const list=$('#memList');

function cleanWords(i){return Q.a[i][6].split(' ').filter(w=>LETTER.test(w))}
function diffWords(exp,said){const E=exp.map(norm),Sd=said.map(norm);const n=E.length,m=Sd.length;
  const L=Array.from({length:n+1},()=>new Int16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=E[i]===Sd[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){if(E[i]===Sd[j]){ops.push({t:'ok',e:exp[i]});i++;j++}else if(L[i+1][j]>=L[i][j+1]){ops.push({t:'miss',e:exp[i]});i++}else{ops.push({t:'extra',s:said[j]});j++}}
  while(i<n)ops.push({t:'miss',e:exp[i++]});while(j<m)ops.push({t:'extra',s:said[j++]});
  // pair miss+extra into substitutions
  const out=[];for(let k=0;k<ops.length;k++){const a=ops[k],b=ops[k+1];
    if(b&&((a.t==='miss'&&b.t==='extra')||(a.t==='extra'&&b.t==='miss'))){const e=a.t==='miss'?a.e:b.e,s=a.t==='extra'?a.s:b.s;const ne=norm(e),ns=norm(s);
      const wf=ne.length>1&&ns.length>1&&'وف'.includes(ne[0])&&'وف'.includes(ns[0])&&ne[0]!==ns[0]&&ne.slice(1)===ns.slice(1);
      out.push({t:wf?'wf':'sub',e,s,lt:wf?null:letterSwap(ne,ns)});k++}else out.push(a)}
  return out}
const CONFUSE=[['ذ','ز','ظ','د'],['ث','س','ص'],['ض','د','ظ'],['ح','ه'],['ق','ك'],['ط','ت'],['ع','ا','ء']];
function letterSwap(a,b){if(a.length!==b.length)return null;let d=[];for(let i=0;i<a.length;i++)if(a[i]!==b[i])d.push([a[i],b[i]]);
  if(d.length!==1)return null;const[x,y]=d[0];return CONFUSE.some(g=>g.includes(x)&&g.includes(y))?[x,y]:null}
function doCheck(){const f=+$('#from').value,t=Math.max(f,+$('#to').value);const said=$('#said').value.trim();
  if(!said){$('#result').innerHTML='<div class="feedback mid">Recite or type something first. Tip: the microphone is on the Arabic keyboard, bottom right.</div>';return}
  const exp=[];for(let i=f;i<=t;i++)cleanWords(i).forEach(w=>exp.push({w,i}));
  const ops=diffWords(exp.map(x=>x.w),said.split(/\s+/).filter(Boolean));
  let ok=0,miss=0,sub=0,wf=0,ltrs=[];
  const html=ops.map(o=>{if(o.t==='ok'){ok++;return `<span class="d-ok">${esc(o.e)}</span>`}
    if(o.t==='miss'){miss++;return `<span class="d-miss" title="missed">${esc(o.e)}</span>`}
    if(o.t==='extra')return `<span class="d-extra">${esc(o.s)}</span>`;
    if(o.t==='wf'){wf++;return `<span class="d-wf">${esc(o.e)} <small>(you: ${esc(o.s)})</small></span>`}
    sub++;if(o.lt)ltrs.push(o.lt);return `<span class="d-sub">${esc(o.e)} <small>(you: ${esc(o.s)})</small></span>`}).join(' ');
  const total=exp.length,score=Math.round(100*ok/Math.max(1,total));
  // log wa/fa swaps into the drill
  if(wf){ops.filter(o=>o.t==='wf').forEach(o=>{for(let i=f;i<=t;i++){const ti=TOK[i].findIndex(w=>{const n=norm(w);return isConf(n)&&n.slice(1)===norm(o.e).slice(1)});if(ti>=0){const k=i+':'+ti;S.wf[k]={b:0,due:today(),w:((S.wf[k]||{}).w||0)+1};break}}});save()}

const RULES=`<div class="card"><h2>How to tell و from ف</h2>
 <p class="small" style="margin:0">Before the word, ask one question: <b>Is this the result, or the very next step, of what came before?</b> Then it is usually <b class="ar">فَ</b>. If it simply adds another fact, another person, or a new scene, it is usually <b class="ar">وَ</b>.</p>
 <dl class="attr"><dt class="ar" style="font-size:22px">فَ</dt><dd>Next step straight away (<span class="ar">ترتيب وتعقيب</span>): <span class="ar">فَأَخْرَجَهُمَا</span>. Cause and result (<span class="ar">سببية</span>). Answer after a condition (<span class="ar">إِنْ … فَ</span>, <span class="ar">مَنْ … فَ</span>, <span class="ar">أَمَّا … فَ</span>). After a command: <span class="ar">ادْخُلُوا … فَكُلُوا</span>.</dd>
 <dt class="ar" style="font-size:22px">وَ</dt><dd>Joining two things that are together, no order (<span class="ar">مطلق الجمع</span>). Starting a new sentence or story (<span class="ar">وَإِذْ</span>, <span class="ar">وَلَقَدْ</span>). Oaths (<span class="ar">وَٱلْفَجْرِ</span>). Describing a situation (<span class="ar">واو الحال</span>).</dd></dl>
 <p class="ml" style="margin:0">ഓർമ്മിക്കാൻ: മുമ്പ് പറഞ്ഞതിന്റെ <b>ഫലമോ തൊട്ടടുത്ത പടിയോ</b> ആണെങ്കിൽ <b class="ar">ف</b>. വെറുതെ <b>ഒന്നുകൂടി ചേർക്കുക</b>യാണെങ്കിൽ <b class="ar">و</b>.</p></div>
 <div class="card"><h3>A famous pair</h3>
 <div class="mus" style="font-size:22px;text-align:right;line-height:2"><span class="tiny muted">Al-Baqarah 2:58</span> وَإِذْ قُلْنَا ٱدْخُلُوا۟ هَٰذِهِ ٱلْقَرْيَةَ <span class="hit">فَكُلُوا۟</span> مِنْهَا حَيْثُ شِئْتُمْ رَغَدًۭا</div>
 <div class="mus" style="font-size:22px;text-align:right;line-height:2"><span class="tiny muted">Al-A'raf 7:161</span> وَإِذْ قِيلَ لَهُمُ ٱسْكُنُوا۟ هَٰذِهِ ٱلْقَرْيَةَ <span class="hit">وَكُلُوا۟</span> مِنْهَا حَيْثُ شِئْتُمْ</div>
 <p class="small" style="margin:0">Scholars of <span class="ar">المتشابه اللفظي</span> explain it this way: <b>enter → then eat</b> is a sequence, so <b class="ar">ف</b>. <b>Live there and eat</b> happen together, so <b class="ar">و</b>. Hook the letter to the verb before it.</p></div>
 <div class="card"><h3>What fixes the habit</h3><ol class="small"><li>Never revise a look-alike ayah alone. Recite it next to its twin (see "Look-alike ayat").</li><li>Say the verb before the letter louder in your head: <span class="ar">ادخلوا ← فـ</span>, <span class="ar">اسكنوا ← وَ</span>.</li><li>When the drill catches a mistake, open the page and read the ayah 5 times looking, then 5 without.</li><li>Keep using one printed mushaf. Your eye remembers where the letter sits on the page.</li></ol></div>`;

  [['ص','س'],['ظ','ذ'],['ض','د']].forEach(([h,l])=>{if(!m[h]||!m[l]||isNaN(m[h].F2)||isNaN(m[l].F2))return;const d=Math.round(m[l].F2-m[h].F2);

/* ================= MUSHAF LAYOUTS (exact pages and lines) ================= */
const LAYOUTS={madani:{t:'Madani · 15 lines · 604 pages',script:'u'},ip15:{t:'Indo-Pak · 15 lines (Hafizi) · 610 pages',script:'i'},ip16:{t:'Indo-Pak · 16 lines · 548 pages',script:'i'}};
let LAYD=null,LAY=null,AP=null,WU=null,WI=null;
function buildLayout(name){if(!LAYOUTS[name])name='madani';const d=LAYD.L[name];const L=d.lines,n=d.n;
  if(!WU){WU=LAYD.w.map(x=>x.split(' '));WI=LAYD.wi.map(x=>x.split(' '))}
  const lines=Array.from({length:n*L},()=>[]);AP=new Int16Array(Q.a.length);
  d.runs.forEach((r,i)=>{let k=0;r.forEach(([g,c])=>{for(let x=0;x<c;x++){lines[g].push([i,k]);k++}});AP[i]=Math.floor(r[0][0]/L)+1});
  PAGES=Array.from({length:n+1},()=>[]);
  for(let p=1;p<=n;p++){const seen=new Set();for(let l=0;l<L;l++)lines[(p-1)*L+l].forEach(([i])=>{if(!seen.has(i)){seen.add(i);PAGES[p].push(i)}})}
  JUZP=Array.from({length:31},()=>[]);for(let p=1;p<=n;p++){if(PAGES[p].length)JUZP[Q.a[PAGES[p][0]][2]].push(p)}
  LAY={name,L,n,lines,script:LAYOUTS[name].script}}
function switchLayout(name){if(!LAY||name===LAY.name)return;const oldAP=AP,oldPages=S.pages,cur=PAGES[S.cur]&&PAGES[S.cur][0];
  buildLayout(name);S.layout=name;const np={};
  for(let p=1;p<=LAY.n;p++){let rev=false,act=null;new Set(PAGES[p].map(i=>oldAP[i])).forEach(op=>{const o=oldPages[op];if(!o)return;if(o.st==='revive')rev=true;else if(!act)act={...o};else{act.s=Math.min(act.s,o.s);act.due=Math.min(act.due,o.due)}});
    if(rev)np[p]={st:'revive'};else if(act)np[p]=act}
  S.pages=np;if(cur!==undefined)S.cur=AP[cur];revealed=new Set();save()}
function wordText(i,k){const arr=LAY.script==='i'?WI[i]:WU[i];return (arr[k]||'').replace(/[\u00a0 \u200b\u200f]+(?=[\u06D6-\u06DC\u06E2\u06E9])/g,'').replace(/\u00a0/g,' ')}
function pageHTML(p){const L=LAY.L,out=[];const base=(p-1)*L;
  const firstItem=g=>{for(let x=g;x<Math.min(LAY.lines.length,g+L*2);x++)if(LAY.lines[x].length)return LAY.lines[x][0];return null};
  const opt={color:S.color,wf:S.markwf,hint:S.mode==='hint'};
  for(let l=0;l<L;l++){const items=LAY.lines[base+l];
    if(!items.length){const nx=firstItem(base+l+1);let cls='blank',html='';
      if(nx&&nx[1]===0&&Q.a[nx[0]][1]===1){const s=Q.a[nx[0]][0];let gap=0;for(let x=base+l+1;x<LAY.lines.length&&!LAY.lines[x].length;x++)gap++;
        const needB=s!==1&&s!==9;
        if(needB&&gap===0){cls='basm';let hd=true;for(let x=base+l-1;x>=base;x--){if(!LAY.lines[x].length){hd=false}break}if(l===0){const pv=base-1;hd=!(pv>=0&&!LAY.lines[pv].length)}html=(hd?`<span class="sn">سورة ${esc(SUR[s-1][0])}</span>`:'')+(LAY.script==='i'?'بِسۡمِ اللّٰہِ الرَّحۡمٰنِ الرَّحِیۡمِ':'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ')}
        else if((needB&&gap===1)||(!needB&&gap===0)){cls='shead';html=`<span class="n">سورة ${esc(SUR[s-1][0])}</span>`}}
      out.push(`<div class="ln ${cls}">${html}</div>`);continue}
    let h='';items.forEach(([i,k])=>{const words=WU[i];const hidden=(S.mode==='hide'||S.mode==='test')&&!revealed.has(i);const sel=selAyah===i?' sel':'';
      if(k>=words.length){h+=`<span class="w anum${sel}" data-a="${i}">${LAY.script==='i'?'۝'+AD(Q.a[i][1]):'﴿'+AD(Q.a[i][1])+'﴾'}</span>`;return}
      const t=wordText(i,k);
      if(hidden&&!(S.mode==='test'&&k===0))h+=`<span class="w hw" data-a="${i}">${esc(t)}</span>`;
      else{opt.tj=hidden?null:tjWord(i,k);h+=`<span class="w${sel}${hidden?' anchor':''}" data-a="${i}">${renderWord(t,hidden?{}:opt)}</span>`}});
    out.push(`<div class="ln">${h}</div>`)}
  return out.join('')}
function fitPage(){const m=$('#mus');if(!m||!m.classList.contains('lay'))return;const pr=m.parentElement;const cs=getComputedStyle(pr);const W=pr.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);if(!W||W<50)return;

/* ================= BEFORE SALAH (Qirath for Fajr, Maghrib, Isha) ================= */
const PRAYERS=[['fajr','Fajr','الفجر'],['maghrib','Maghrib','المغرب'],['isha','Isha','العشاء']];
function nextPrayer(){const d=new Date(),h=d.getHours()+d.getMinutes()/60;return h<10?'fajr':h<19.25?'maghrib':'isha'}
const QW={};function qWords(q){const k=q.s+':'+q.a+':'+q.e;if(!QW[k])QW[k]=qIds(q).reduce((s,i)=>s+WU[i].length,0);return QW[k]}
const qPos=q=>q.s*1000+q.a;
function salahPick(pr,swap){const d=today();S.salah=S.salah||{};const key=d+':'+pr;
  if(swap===undefined&&S.salah[key]&&S.salah[key].every(n=>S.qirath[n]))return S.salah[key];
  const used=new Set();for(let k=0;k<=2;k++)PRAYERS.forEach(([p])=>{if(k===0&&p===pr)return;const v=S.salah[(d-k)+':'+p];if(v)v.forEach(n=>used.add(n))});
  const all=S.qirath.map((q,n)=>({n,q,w:qWords(q)}));if(all.length<2)return all.map(x=>x.n);
  const pref=pr==='maghrib'?x=>x.w:pr==='fajr'?x=>-x.w:x=>Math.abs(x.w-90);
  const rank=arr=>arr.sort((a,b)=>(b.q.st-a.q.st)||(pref(a)-pref(b)));
  let cur=S.salah[key]?S.salah[key].slice():null;
  let pool=all.filter(x=>!used.has(x.n));if(pool.length<4)pool=all.slice();
  if(cur&&swap!==undefined){const keep=cur[1-swap];const opts=rank(pool.filter(x=>!cur.includes(x.n)));const top=opts.slice(0,6);const pick=top.length?top[Math.floor(Math.random()*top.length)]:all.find(x=>!cur.includes(x.n));cur=[keep,pick.n]}
  else{const r=rank(pool.slice());const okA=r.filter(x=>pool.some(y=>y.n!==x.n&&qPos(y.q)>qPos(x.q)&&!(y.q.s===x.q.s&&y.q.a<=x.q.e)));const top=(okA.length?okA:r).slice(0,6);const a=top[Math.floor(Math.random()*top.length)];
    let after=rank(pool.filter(x=>x.n!==a.n&&qPos(x.q)>qPos(a.q)&&!(x.q.s===a.q.s&&x.q.a<=a.q.e)));
    if(!after.length)after=rank(all.filter(x=>x.n!==a.n&&qPos(x.q)>qPos(a.q)));
    const b=after.length?after[Math.floor(Math.random()*Math.min(3,after.length))]:rank(all.filter(x=>x.n!==a.n))[0];cur=[a.n,b.n]}
  cur.sort((x,y)=>qPos(S.qirath[x])-qPos(S.qirath[y]));
  S.salah[key]=cur;Object.keys(S.salah).forEach(k=>{if(+k.split(':')[0]<d-7)delete S.salah[k]});save();return cur}
let SV={pr:null,test:[false,false],rev:new Set()};
function passageHTML(ids,test){const ip=LAY&&LAY.script==='i';return ids.map(i=>{const n=WU[i].length;const hidden=test&&!SV.rev.has(i);let h='';

    MIC={stop:false};b.textContent='■ Stop and check';b.classList.remove('primary');b.setAttribute('aria-pressed','true');start()}}
function bindMkMic(letters){const b=$('#mkMic');if(!b)return;if(!SRC||!MK.target){b.hidden=!SRC;b.disabled=!MK.target;return}
  b.onclick=()=>{const r=new SRC();r.lang='ar-SA';r.continuous=false;r.interimResults=false;b.disabled=true;b.textContent='Listening…';
    r.onresult=e=>{const t=e.results[0][0].transcript;$('#mkSaid').value=t;MK.said=t;MK.fb=checkLetter(MK.target,t,letters);$('#mkFb').innerHTML=MK.fb};
    r.onerror=e=>{$('#mkFb').innerHTML='<div class="feedback mid">I could not hear a word. Try again, closer to the phone.</div>'};
    r.onend=()=>{b.disabled=false;b.textContent='🎙 Say the word'};
    try{r.start()}catch(e){b.disabled=false}}}
let REC=null;
async function startLive(){if(REC)return stopLive();
  const AC=window.AudioContext||window.webkitAudioContext;
  try{const ac=new AC();await ac.resume();
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=ac.createMediaStreamSource(stream),sp=ac.createScriptProcessor(4096,1,1),g=ac.createGain();g.gain.value=0;const ch=[];let lvl=0;
    sp.onaudioprocess=e=>{const d=e.inputBuffer.getChannelData(0);ch.push(new Float32Array(d));let m=0;for(let i=0;i<d.length;i+=8)m=Math.max(m,Math.abs(d[i]));lvl=m};
    src.connect(sp);sp.connect(g);g.connect(ac.destination);
    REC={ac,stream,sp,ch,t0:Date.now()};
    const btn=$('#recLive');btn.textContent='■ Stop';btn.classList.remove('primary');
    REC.tick=setInterval(()=>{const s=((Date.now()-REC.t0)/1000).toFixed(0);sndStatus(`<div class="feedback mid">Recording… ${s}s <span class="bar" style="display:inline-block;width:120px;vertical-align:middle"><i style="width:${Math.min(100,Math.round(lvl*140))}%"></i></span> Say the syllables with pauses, then tap Stop.</div>`);if(Date.now()-REC.t0>30000)stopLive()},150);
  }catch(e){sndStatus('<div class="feedback bad">The microphone is not allowed. On iPhone: Settings › Safari › Microphone › Allow (or tap "aA" in Safari › Website Settings › Microphone).</div>')}}
function stopLive(){if(!REC)return;const r=REC;REC=null;clearInterval(r.tick);try{r.sp.disconnect();r.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  const fs=r.ac.sampleRate;try{r.ac.close()}catch(e){}
  let n=0;r.ch.forEach(c=>n+=c.length);const x=new Float32Array(n);let o=0;r.ch.forEach(c=>{x.set(c,o);o+=c.length});
  const btn=$('#recLive');if(btn){btn.textContent='🎙 Record now';btn.classList.add('primary')}
  analyseSig({x,fs})}
/* ---- backup (progress lives on this phone) ---- */
function backupHTML(){return `<details><summary>Backup my progress</summary><div>
  <p class="small" style="margin:0">Your progress is saved on this phone only. If you delete the app icon, it is lost. Copy a backup now and then (paste it into Notes or WhatsApp to yourself).</p>
  <div class="row"><button class="primary sm" id="bkCopy">Copy backup</button></div>
  <label class="small" for="bkIn">Restore: paste a backup here</label><textarea id="bkIn" style="font-family:var(--f-ui);font-size:13px;direction:ltr;min-height:70px"></textarea>
  <div class="row"><button class="sm" id="bkRestore">Restore</button><span id="bkMsg" class="small"></span></div></div></details>`}
function bindBackup(){const c=$('#bkCopy');if(!c)return;
  c.onclick=()=>{const t=JSON.stringify(S);const ok=()=>toast('Backup copied. Paste it somewhere safe.');
    try{navigator.clipboard.writeText(t).then(ok,()=>{$('#bkIn').value=t;$('#bkIn').select();toast('Select all and copy the text')})}catch(e){$('#bkIn').value=t;$('#bkIn').select()}};
  $('#bkRestore').onclick=()=>{try{const o=JSON.parse($('#bkIn').value);if(!o||!o.pages)throw 0;S=Object.assign(DEF(),o);save();$('#bkMsg').textContent='Restored.';toast('Progress restored')}catch(e){$('#bkMsg').textContent='That is not a valid backup.'}}}

/* ---------------- boot ---------------- */
function connect(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
loadData().then(()=>{try{migrateQirath();qirathToMem();route()}catch(e){$('#app').innerHTML='<div class="card" style="margin-top:16px">Something went wrong while opening: '+esc(e&&e.message||e)+'. Please send me a screenshot.</div>'}}).catch(e=>{$('#app').innerHTML='<div class="card" style="margin-top:16px">The Qur\'an text did not load ('+esc(e&&e.message||e)+'). Reload the page.</div>'});
connect();
})();
